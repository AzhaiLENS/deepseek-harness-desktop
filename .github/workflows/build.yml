name: build

# Builds the standalone DeepSeek Harness Desktop installers for every supported desktop
# platform. Each leg vendors its OWN runtime payload, because the payload
# contains a platform-specific Node.js binary and platform-specific native
# addons (koffi, node-pty, sharp, @vscode/ripgrep) — a payload can never be
# shared between operating systems.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin the toolchain so released installers are reproducible.
  NODE_VERSION: "26.7.0"
  DSH_VERSION: "0.1.5-rc.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            tauri-args: "--target aarch64-apple-darwin"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            tauri-args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            tauri-args: ""
          - os: windows-latest
            platform: win32
            arch: x64
            tauri-args: ""

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            zstd \
            file \
            wget

      - name: Install zstd (macOS)
        if: matrix.platform == 'darwin'
        run: brew install zstd

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin' && (matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      # The payload is ~100 MB per platform and completely reproducible, so it is
      # vendored per run rather than committed.
      - name: Vendor the DSH runtime payload
        shell: bash
        run: |
          bash scripts/vendor-runtime.sh \
            --version "$DSH_VERSION" \
            --node "$NODE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --out "$GITHUB_WORKSPACE/dist"

      - name: Stage the payload next to the Tauri config
        shell: bash
        run: |
          mkdir -p src-tauri/payload
          cp dist/dsh-payload-* src-tauri/payload/
          ls -la src-tauri/payload

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Generate the full icon set (icns/ico/pngs) from the committed brand
      # source image. Must run AFTER tauri-cli is installed.
      - name: Generate icons
        run: cargo tauri icon src-tauri/icons/source.png

      - name: Build the application
        run: cargo tauri build --ci ${{ matrix.tauri-args }}

      # Acceptance gate: run the REAL bootstrap headlessly against the bundle
      # payload — extract, start DSH, exchange the token, fetch the UI. Fails
      # the leg if anything in the payload/shell contract is broken.
      # (macOS legs build with --target <triple>, so the binary is not always
      # at target/release/ — locate it instead of hard-coding the path.)
      - name: Headless self-check
        shell: bash
        run: |
          BIN=$(find src-tauri/target -type f \( -name dsh-desktop -o -name dsh-desktop.exe \) -path "*release*" | head -1)
          echo "self-check binary: $BIN"
          DSH_DESKTOP_DATA="$PWD/.selfcheck-data" \
          DSH_DESKTOP_PAYLOAD="$PWD/src-tauri/payload" \
          "$BIN" --self-check

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
