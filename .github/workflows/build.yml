name: build

# Builds the standalone DeepSeek Harness Desktop installers for every supported desktop
# platform. Each leg vendors its OWN runtime payload, because the payload
# contains a platform-specific Node.js binary and platform-specific native
# addons (koffi, node-pty, sharp, @vscode/ripgrep) — a payload can never be
# shared between operating systems.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin the toolchain so released installers are reproducible.
  NODE_VERSION: "26.7.0"
  DSH_VERSION: "0.1.5-rc.2"
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            tauri-args: "--target aarch64-apple-darwin --bundles dmg"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            tauri-args: "--target x86_64-apple-darwin --bundles dmg"
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            tauri-args: "--bundles appimage"
          - os: windows-latest
            platform: win32
            arch: x64
            tauri-args: "--bundles nsis"
          # --- ARM64 coverage: every OS ships both instruction sets ---
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            tauri-args: "--bundles deb"
          - os: windows-11-arm
            platform: win32
            arch: arm64
            tauri-args: "--bundles nsis"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            zstd \
            file \
            wget

      - name: Install zstd (macOS)
        if: matrix.platform == 'darwin'
        run: brew install zstd

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin' && (matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      # The payload is ~100 MB per platform and completely reproducible, so it is
      # vendored per run rather than committed.
      - name: Vendor the DSH runtime payload
        shell: bash
        run: |
          bash scripts/vendor-runtime.sh \
            --version "$DSH_VERSION" \
            --node "$NODE_VERSION" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --out "$GITHUB_WORKSPACE/dist"

      - name: Stage the payload next to the Tauri config
        shell: bash
        run: |
          mkdir -p src-tauri/payload
          cp dist/dsh-payload-* src-tauri/payload/
          ls -la src-tauri/payload

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Generate the full icon set (icns/ico/pngs) from the committed brand
      # source image. Must run AFTER tauri-cli is installed.
      - name: Generate icons
        run: cargo tauri icon src-tauri/icons/source.png

      # The cargo cache restores src-tauri/target wholesale, which also brings
      # back installer bundles from earlier runs. Without this the artifacts and
      # the release would carry stale installers of other formats built from
      # older commits (and triple the apparent download size).
      - name: Clean stale bundle output
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
          echo "bundle dirs after clean:"
          find src-tauri/target -maxdepth 4 -type d -name bundle | head -5 || true

      - name: Build the application
        run: cargo tauri build --ci ${{ matrix.tauri-args }}

      # Acceptance gate: run the REAL bootstrap headlessly against the bundle
      # payload — extract, start DSH, exchange the token, fetch the UI. Fails
      # the leg if anything in the payload/shell contract is broken.
      # (macOS legs build with --target <triple>, so the binary is not always
      # at target/release/ — locate it instead of hard-coding the path.)
      - name: Headless self-check
        shell: bash
        run: |
          BIN=$(find src-tauri/target -type f \( -name dsh-desktop -o -name dsh-desktop.exe \) -path "*release*" | head -1)
          echo "self-check binary: $BIN"
          DSH_DESKTOP_DATA="$PWD/.selfcheck-data" \
          DSH_DESKTOP_PAYLOAD="$PWD/src-tauri/payload" \
          "$BIN" --self-check

      # ---- Prove the PACKAGED installer works, not just the build tree -------
      # The self-check above runs the binary from target/release; these steps
      # install/mount the actual artifact that users download and run its
      # self-check from inside, so a broken bundle cannot ship unnoticed.
      - name: Self-check inside the packaged installer (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          DMG=$(find src-tauri/target -type f -name "*.dmg" | head -1)
          echo "packaged artifact: $DMG"
          # Mount at a fixed path: hdiutil's own output ends with a mount point
          # that contains spaces ("/Volumes/DeepSeek Harness Desktop"), which
          # field-splitting silently truncates.
          MP="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MP" >/dev/null
          echo "mounted at: $MP"
          BIN=$(find "$MP" -maxdepth 4 -type f -name dsh-desktop | head -1)
          PL=$(dirname "$(find "$MP" -type f -name 'dsh-payload-*.tar.zst' | head -1)")
          echo "binary inside installer : $BIN"
          echo "payload inside installer: $PL"
          file "$BIN"
          DSH_DESKTOP_DATA="$PWD/.selfcheck-packaged" DSH_DESKTOP_PAYLOAD="$PL" "$BIN" --self-check
          hdiutil detach "$MP" -quiet || true
          rmdir "$MP" 2>/dev/null || true

      - name: Self-check inside the packaged installer (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          IMG=$(find src-tauri/target -type f -name "*.AppImage" | head -1)
          echo "packaged artifact: $IMG"
          chmod +x "$IMG"
          WD="$(mktemp -d)"
          ( cd "$WD" && "$OLDPWD/$IMG" --appimage-extract >/dev/null )
          PL=$(dirname "$(find "$WD/squashfs-root" -type f -name 'dsh-payload-*.tar.zst' | head -1)")
          echo "payload inside installer: $PL"
          if DSH_DESKTOP_DATA="$PWD/.selfcheck-packaged" DSH_DESKTOP_PAYLOAD="$PL" "$IMG" --self-check; then
            echo "AppImage ran directly"
          else
            echo "direct AppImage run unavailable (FUSE?) — running the extracted AppRun"
            APPDIR="$WD/squashfs-root" DSH_DESKTOP_DATA="$PWD/.selfcheck-packaged" DSH_DESKTOP_PAYLOAD="$PL" "$WD/squashfs-root/AppRun" --self-check
          fi

      - name: Self-check inside the packaged installer (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path src-tauri/target -Filter *setup.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer found" }
          Write-Host "packaged artifact: $($exe.FullName)"
          $dir = "$env:RUNNER_TEMP\dsh-install"
          Start-Process -FilePath $exe.FullName -ArgumentList "/S","/D=$dir" -Wait
          $bin = Get-ChildItem -Recurse -Path $dir -Filter dsh-desktop.exe | Select-Object -First 1
          if (-not $bin) { throw "dsh-desktop.exe not found after silent install" }
          $pl = Get-ChildItem -Recurse -Path $dir -Filter "dsh-payload-*.tar.zst" | Select-Object -First 1
          if (-not $pl) { throw "payload not found inside the installed application" }
          Write-Host "binary inside installer : $($bin.FullName)"
          Write-Host "payload inside installer: $($pl.DirectoryName)"
          $env:DSH_DESKTOP_DATA = "$env:RUNNER_TEMP\dsh-selfcheck"
          $env:DSH_DESKTOP_PAYLOAD = $pl.DirectoryName
          & $bin.FullName --self-check

      - name: Report installer sizes
        shell: bash
        run: |
          echo "=== bundle files, exact bytes ==="
          while IFS= read -r f; do
            printf "%12d  %s\n" "$(wc -c < "$f")" "${f##*/}"
          done < <(find src-tauri/target -path '*release/bundle/*' -type f | sort)
          echo "=== payload archive ==="
          while IFS= read -r f; do printf "%12d  %s\n" "$(wc -c < "$f")" "${f##*/}"; done < <(find src-tauri/payload -type f)

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # One installer per platform: dmg (macOS), deb (Linux), NSIS exe
          # (Windows). The AppImage is deliberately not shipped: it bundles
          # WebKitGTK and is ~3x larger than the deb (158 MiB vs 50 MiB) for no
          # benefit on a desktop that already ships GTK/WebKit.
          files: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.exe
