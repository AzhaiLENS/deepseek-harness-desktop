[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness as a standalone desktop application"
authors = ["DSH Desktop"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-harness"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset"] }
# 注意：不加 tauri-plugin-window-state —— 它按物理像素存取窗口几何，在 2x 高分屏
# 上会把窗口缩成一半逻辑点（界面挤压、启动页被裁）。见 src/geometry.rs。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
sha2 = "0.10"
ureq = { version = "2", features = ["tls", "json", "gzip"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
